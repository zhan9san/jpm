name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Weekly advisory check against default branch.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Prebuilt binary: building cargo-audit from source took ~3 minutes.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: cargo audit
